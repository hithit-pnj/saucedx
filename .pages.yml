# Configuration de Pages CMS — https://pagescms.org
#
# Alice édite les textes sur app.pagescms.org. Chaque enregistrement écrit un
# commit dans ce dépôt, ce qui déclenche la reconstruction et la mise en ligne.
#
# Garde-fous posés volontairement :
#   - offres  : renommage et suppression bloqués (le nom du fichier fait l'URL) ;
#   - légales : création, renommage et suppression bloqués (deux pages, pas plus) ;
#   - réglages : suppression bloquée.

media:
  input: public/media
  output: /media
  extensions: [png, jpg, jpeg, webp, svg]

content:
  # ─── Les cinq pages d'offres ──────────────────────────────────────────────
  - name: offres
    label: Les offres
    type: collection
    path: src/content/offres
    format: yaml-frontmatter
    filename: '{fields.menu}.md'
    operations:
      rename: false
      delete: false
    view:
      fields: [menu, ordre, publie]
      primary: menu
      sort: [ordre, menu]
      search: [menu]
      default:
        sort: ordre
        order: asc
    fields:
      - name: menu
        label: Nom dans le menu
        type: string
        required: true
        description: Sert aussi de nom de fichier et donc d'adresse de la page.

      - name: ordre
        label: Ordre d'affichage
        type: number
        description: Détermine la place dans le menu et sur l'accueil.
        options: { min: 1, max: 20, step: 1 }

      - name: publie
        label: Page en ligne
        type: boolean
        default: true
        description: Décochez pour retirer la page du site sans la supprimer.

      - name: climat
        label: Climat (couleur d'accent)
        type: select
        options:
          values:
            - { name: garance, label: Garance (rouge profond) }
            - { name: ambre, label: Ambre profond }
            - { name: prune, label: Prune }
            - { name: vert, label: Vert profond }
            - { name: bronze, label: Bronze }
            - { name: nuit, label: Bleu nuit }
            - { name: ardoise, label: Ardoise }

      - name: glyphe
        label: Geste graphique
        type: select
        options:
          values:
            - { name: rayonnement, label: Le rayonnement }
            - { name: visavis, label: Le vis-à-vis }
            - { name: meandre, label: Le méandre }
            - { name: fleche, label: La flèche du temps }
            - { name: collectif, label: Le collectif }
            - { name: cernes, label: Les cernes }

      - name: porte
        label: La porte sur l'accueil
        type: object
        fields:
          - { name: intitule, label: Intitulé, type: string }
          - name: precision
            label: Précision (en petites capitales)
            type: string
            description: Courte — elle tient sur une ligne.

      - name: hero
        label: Ouverture de la page
        type: object
        fields:
          - name: lignes
            label: Titre — une ligne par entrée
            type: string
            list: { min: 1, max: 3 }
          - { name: surtitre, label: Sur-titre, type: string }
          - name: verbes
            label: Les verbes à l'infinitif
            type: string
            list: { max: 6 }
            description: Laissez vide si les verbes sont portés par les formats ci-dessous.
          - { name: citation, label: Citation, type: text }
          - { name: mention, label: Mention de bas de page, type: string }

      - name: sections
        label: Les formats
        type: object
        description: Un seul format en général ; deux pour la page À La Cordée.
        list:
          min: 1
          max: 3
          collapsible:
            collapsed: false
            summary: '{titre} — format {index}'
        fields:
          - name: titre
            label: Titre du format
            type: string
            description: Affiché seulement s'il y a plusieurs formats.
          - { name: sousTitre, label: Sous-titre, type: string }
          - name: glyphe
            label: Geste graphique du format
            type: select
            options:
              values:
                - { name: rayonnement, label: Le rayonnement }
                - { name: visavis, label: Le vis-à-vis }
                - { name: meandre, label: Le méandre }
                - { name: fleche, label: La flèche du temps }
                - { name: collectif, label: Le collectif }
                - { name: cernes, label: Les cernes }
          - name: verbes
            label: Verbes propres à ce format
            type: string
            list: { max: 6 }
          - { name: texte, label: Texte principal, type: text }
          - name: blocs
            label: Blocs pratiques
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{titre}'
            fields:
              - { name: titre, label: Intitulé, type: string }
              - { name: texte, label: Texte, type: text }

      - name: cta
        label: L'appel au contact
        type: object
        fields:
          - { name: titre, label: Titre, type: string }
          - { name: texte, label: Texte, type: text }
          - { name: label, label: Libellé du bouton, type: string }
          - name: sujet
            label: Sujet pré-rempli dans le formulaire
            type: string
            description: Apparaît dans l'objet du mail que vous recevrez.

      - name: seo
        label: Référencement
        type: object
        fields:
          - { name: titre, label: Titre affiché dans l'onglet et sur Google, type: string }
          - name: description
            label: Description
            type: text
            description: Entre 150 et 160 signes, c'est l'idéal.

  # ─── L'accueil ────────────────────────────────────────────────────────────
  - name: accueil
    label: Accueil
    type: file
    path: src/content/pages/accueil.md
    format: yaml-frontmatter
    operations:
      delete: false
    fields:
      - name: seo
        label: Référencement
        type: object
        fields:
          - { name: titre, label: Titre, type: string }
          - { name: description, label: Description, type: text }
      - name: donnees
        label: Contenu de la page
        type: object
        fields:
          - name: hero
            label: L'enseigne
            type: object
            fields:
              - name: lignes
                label: Enseigne — une ligne par entrée
                type: string
                list: { min: 1, max: 3 }
              - { name: surtitre, label: Sur-titre, type: string }
              - { name: lieu, label: Lieu, type: string }
          - name: manifeste
            label: Le manifeste
            type: object
            fields:
              - { name: probleme, label: Le problème nommé, type: text }
              - { name: geste, label: Le geste en réponse, type: text }
              - { name: sceau, label: Phrase au-dessus des portes, type: string }
          - name: entreprise
            label: La section « En entreprise »
            type: object
            description: >-
              Les offres citées ici se lisent côte à côte, sous un chapeau commun, au lieu de suivre
              les autres dans la liste des portes.
            fields:
              - { name: surtitre, label: Sur-titre, type: string }
              - { name: titre, label: Chapeau commun, type: string }
              - name: colonnes
                label: Les colonnes
                type: object
                list: { min: 1, max: 2 }
                fields:
                  - name: offre
                    label: Offre
                    type: select
                    options:
                      values:
                        - { name: permanence-entreprise, label: Permanence en entreprise }
                        - { name: atelier-entreprise, label: Atelier en entreprise }
                  - { name: texte, label: Résumé — deux ou trois lignes, type: text }
          - name: portrait
            label: Vous, brièvement
            type: object
            fields:
              - { name: surtitre, label: Sur-titre, type: string }
              - { name: titre, label: Nom, type: string }
              - { name: texte, label: Texte, type: text }
              - { name: photo, label: Photo, type: image }
              - { name: photoAlt, label: Description de la photo, type: string }
              - { name: lien, label: Libellé du lien, type: string }
          - name: appel
            label: L'appel au contact
            type: object
            fields:
              - { name: titre, label: Titre, type: string }
              - { name: texte, label: Texte, type: text }
              - { name: label, label: Libellé du bouton, type: string }

  # ─── Qui suis-je ──────────────────────────────────────────────────────────
  - name: qui-suis-je
    label: Qui suis-je
    type: file
    path: src/content/pages/qui-suis-je.md
    format: yaml-frontmatter
    operations:
      delete: false
    fields:
      - name: seo
        label: Référencement
        type: object
        fields:
          - { name: titre, label: Titre, type: string }
          - { name: description, label: Description, type: text }
      - name: donnees
        label: Contenu de la page
        type: object
        fields:
          - name: hero
            label: Ouverture
            type: object
            fields:
              - name: lignes
                label: Titre — une ligne par entrée
                type: string
                list: { min: 1, max: 3 }
              - { name: surtitre, label: Sur-titre, type: string }
              - { name: citation, label: Citation, type: text }
          - { name: photo, label: Portrait, type: image }
          - { name: photoAlt, label: Description de la photo, type: string }
          - { name: photoLegende, label: Légende sous la photo, type: string }
          - name: texte
            label: Le récit — un paragraphe par entrée
            type: text
            list: true
          - name: reperes
            label: Repères
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{titre}'
            fields:
              - { name: titre, label: Intitulé, type: string }
              - { name: texte, label: Texte, type: text }
          - name: appel
            label: L'appel au contact
            type: object
            fields:
              - { name: titre, label: Titre, type: string }
              - { name: texte, label: Texte, type: text }
              - { name: label, label: Libellé du bouton, type: string }

  # ─── Contact ──────────────────────────────────────────────────────────────
  - name: contact
    label: Contact
    type: file
    path: src/content/pages/contact.md
    format: yaml-frontmatter
    operations:
      delete: false
    fields:
      - name: seo
        label: Référencement
        type: object
        fields:
          - { name: titre, label: Titre, type: string }
          - { name: description, label: Description, type: text }
      - name: donnees
        label: Contenu de la page
        type: object
        fields:
          - name: hero
            label: Ouverture
            type: object
            fields:
              - name: lignes
                label: Titre — une ligne par entrée
                type: string
                list: { min: 1, max: 3 }
              - { name: surtitre, label: Sur-titre, type: string }
              - { name: citation, label: Citation, type: text }
          - { name: intro, label: Texte d'introduction, type: text }
          - name: champs
            label: Libellés du formulaire
            type: object
            fields:
              - { name: nom, label: Champ « nom », type: string }
              - { name: email, label: Champ « mail », type: string }
              - { name: message, label: Champ « message », type: string }
              - { name: consentement, label: Case de consentement RGPD, type: text }
              - { name: envoyer, label: Bouton d'envoi, type: string }
              - { name: envoiEnCours, label: Bouton pendant l'envoi, type: string }
          - name: reponses
            label: Messages affichés après envoi
            type: object
            fields:
              - { name: succes, label: Envoi réussi, type: text }
              - { name: erreur, label: Envoi échoué, type: text }
          - name: autrement
            label: Autres moyens de contact
            type: object
            fields:
              - { name: titre, label: Titre, type: string }
              - { name: texte, label: Texte, type: text }

  # ─── Rendez-vous téléphoniques ────────────────────────────────────────────
  - name: rendez-vous
    label: Rendez-vous téléphoniques
    type: file
    path: src/content/rendez-vous.json
    format: json
    operations:
      delete: false
    fields:
      - name: actif
        label: Proposer des rendez-vous
        type: boolean
        default: true
        description: >-
          Décochez pour retirer le choix de créneaux de la page contact. Les rendez-vous déjà
          confirmés ne sont pas annulés pour autant.

      - name: plages
        label: Vos disponibilités habituelles
        type: object
        description: >-
          Décrivez vos habitudes, pas des dates : « mardi de 14 h à 16 h » vaut pour tous les mardis
          à venir. Le site découpe ces plages en créneaux tout seul.
        list:
          min: 0
          max: 20
          collapsible:
            collapsed: false
            summary: '{jour} — {debut} à {fin}'
        fields:
          - name: jour
            label: Jour
            type: select
            options:
              values:
                - { name: lundi, label: Lundi }
                - { name: mardi, label: Mardi }
                - { name: mercredi, label: Mercredi }
                - { name: jeudi, label: Jeudi }
                - { name: vendredi, label: Vendredi }
                - { name: samedi, label: Samedi }
                - { name: dimanche, label: Dimanche }
          - name: debut
            label: De
            type: string
            pattern:
              regex: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
              message: 'Écrivez l''heure ainsi : 14:00'
          - name: fin
            label: À
            type: string
            pattern:
              regex: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
              message: 'Écrivez l''heure ainsi : 16:00'

      - name: fermetures
        label: Vacances et empêchements
        type: object
        description: >-
          Aucun créneau ne sera proposé entre ces deux dates, bornes comprises. Pour une seule
          journée, mettez la même date des deux côtés.
        list:
          collapsible:
            collapsed: true
            summary: '{motif} — du {du} au {au}'
        fields:
          - { name: du, label: Du, type: date, options: { format: 'yyyy-MM-dd' } }
          - { name: au, label: Au, type: date, options: { format: 'yyyy-MM-dd' } }
          - { name: motif, label: Motif (pour vous seule), type: string }

      - name: duree
        label: Durée d'un appel (minutes)
        type: number
        default: 15
        options: { min: 5, max: 120, step: 5 }

      - name: battement
        label: Battement entre deux appels (minutes)
        type: number
        default: 15
        description: Le temps de souffler. Deux appels ne se collent jamais l'un à l'autre.
        options: { min: 0, max: 120, step: 5 }

      - name: delaiMinimum
        label: Prévenance minimale (heures)
        type: number
        default: 24
        description: Personne ne peut réserver un créneau qui commence dans moins de ce délai.
        options: { min: 0, max: 720, step: 1 }

      - name: horizon
        label: Réservable jusqu'à (jours)
        type: number
        default: 21
        description: Au-delà, les créneaux ne sont pas encore proposés.
        options: { min: 1, max: 120, step: 1 }

      - name: expiration
        label: Une demande sans réponse expire au bout de (heures)
        type: number
        default: 72
        description: Passé ce délai, le créneau se libère tout seul et redevient réservable.
        options: { min: 1, max: 720, step: 1 }

      - name: textes
        label: Les textes affichés
        type: object
        fields:
          - { name: surtitre, label: Sur-titre, type: string }
          - { name: titre, label: Titre, type: string }
          - { name: intro, label: Texte d'introduction, type: text }
          - { name: attente, label: Pendant le chargement des créneaux, type: string }
          - { name: vide, label: Quand aucun créneau n'est libre, type: text }
          - { name: choisi, label: Mention au-dessus du moment choisi, type: string }
          - { name: changer, label: Lien pour changer de moment, type: string }
          - { name: bouton, label: Bouton d'envoi, type: string }
          - { name: boutonEnCours, label: Bouton pendant l'envoi, type: string }
          - { name: consentement, label: Case de consentement RGPD, type: text }
          - { name: succes, label: Demande envoyée, type: text }
          - { name: erreur, label: Demande échouée, type: text }
          - { name: fuseau, label: Mention sur l'heure, type: string }

      - name: champs
        label: Libellés du formulaire
        type: object
        fields:
          - { name: nom, label: Champ « nom », type: string }
          - { name: telephone, label: Champ « téléphone », type: string }
          - { name: email, label: Champ « mail », type: string }
          - { name: motif, label: Champ « ce qui vous amène », type: string }

  # ─── Pages légales ────────────────────────────────────────────────────────
  - name: legal
    label: Pages légales
    type: collection
    path: src/content/legal
    format: yaml-frontmatter
    operations:
      create: false
      rename: false
      delete: false
    view:
      fields: [titre, misAJour]
      primary: titre
    fields:
      - { name: titre, label: Titre de la page, type: string }
      - name: misAJour
        label: Date de mise à jour
        type: string
        description: 'Par exemple : décembre 2026.'
      - name: seo
        label: Référencement
        type: object
        fields:
          - { name: titre, label: Titre, type: string }
          - { name: description, label: Description, type: text }
      - { name: body, label: Contenu de la page, type: rich-text }

  # ─── Réglages ─────────────────────────────────────────────────────────────
  - name: reglages
    label: Réglages du site
    type: file
    path: src/content/reglages.json
    format: json
    operations:
      delete: false
    fields:
      - { name: nom, label: Nom de la marque, type: string }
      - { name: signature, label: Signature, type: string }
      - { name: personne, label: Nom de la personne, type: string }
      - name: email
        label: Adresse de contact
        type: string
        pattern:
          regex: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
          message: Cette adresse mail ne semble pas valide.
      - { name: instagram, label: Compte Instagram, type: string }
      - name: instagramUrl
        label: Lien complet vers Instagram
        type: string
        pattern:
          regex: '^https://.+'
          message: Le lien doit commencer par https://
      - { name: ville, label: Ville, type: string }
      - { name: region, label: Région, type: string }
      - name: baseline
        label: Phrase de présentation
        type: text
        description: Utilisée pour le référencement et les lecteurs d'écran.
